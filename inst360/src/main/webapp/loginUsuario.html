<!DOCTYPE html>
<html lang="pt-br">

    <title>INST360 - LOGIN</title>
</head>
<body>

    <div id="navbar">
        <img id="logo" src="logo.png" alt="">
        <div id="conteiner-links">

            <a class="nav-links" href="cadastroUsuario.html">Cadastro</a>

    <form id="formLogin">

            <p></p>
        </div>

    </form>

    <script src="./js/loginUsuario.js"></script>
